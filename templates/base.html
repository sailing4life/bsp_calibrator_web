<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RaceCal BSP Lab</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #14171a;
      --muted: #68727d;
      --line: #dce2e8;
      --surface: #f7f8fa;
      --panel: #ffffff;
      --panel-soft: #eef3f5;
      --accent: #008b8a;
      --accent-dark: #006b6a;
      --warn: #b7791f;
      --danger: #b42318;
      --good: #12715b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--surface);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .topbar {
      background: #111315;
      color: #f7f8fa;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
    }

    .topbar-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: inherit;
      text-decoration: none;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255, 255, 255, .26);
      border-radius: 8px;
      position: relative;
      background: #1b2024;
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      height: 2px;
      background: var(--accent);
      transform-origin: center;
    }

    .brand-mark::before { top: 13px; transform: rotate(-16deg); }
    .brand-mark::after { bottom: 13px; transform: rotate(16deg); }

    .brand-name {
      font-weight: 750;
      font-size: 1rem;
      line-height: 1;
      margin: 0;
    }

    .brand-sub {
      display: block;
      color: #98a2ad;
      font-size: .78rem;
      margin-top: 4px;
    }

    .env-label {
      color: #b5bec7;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 999px;
      padding: 7px 11px;
      font-size: .78rem;
      white-space: nowrap;
    }

    .app-main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 38px 24px 56px;
    }

    .workspace-head,
    .result-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: end;
      margin-bottom: 24px;
    }

    .eyebrow {
      color: var(--accent-dark);
      font-size: .78rem;
      font-weight: 750;
      text-transform: uppercase;
      margin: 0 0 8px;
    }

    h1, h2, h3, p { letter-spacing: 0; }

    h1 {
      font-size: clamp(2rem, 5vw, 4.4rem);
      line-height: .96;
      font-weight: 780;
      margin: 0;
    }

    h2 {
      font-size: 1.08rem;
      font-weight: 730;
      margin: 0;
    }

    h3 {
      font-size: .96rem;
      font-weight: 730;
      margin: 0;
    }

    .lede {
      max-width: 650px;
      color: var(--muted);
      font-size: 1rem;
      margin: 14px 0 0;
    }

    .workflow-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(92px, 1fr));
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      min-width: 360px;
    }

    .workflow-strip span {
      display: block;
      background: #fff;
      padding: 13px 15px;
      font-size: .78rem;
      color: var(--muted);
    }

    .workflow-strip strong {
      display: block;
      color: var(--ink);
      font-size: .9rem;
      margin-bottom: 2px;
    }

    .upload-grid,
    .result-grid,
    .plots-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .panel-head {
      min-height: 86px;
      padding: 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }

    .panel-kicker {
      color: var(--muted);
      display: block;
      font-size: .78rem;
      font-weight: 700;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .method-badge,
    .score-badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: .76rem;
      padding: 6px 9px;
      white-space: nowrap;
    }

    .panel-body { padding: 20px; }

    .field-label {
      font-size: .82rem;
      font-weight: 700;
      margin-bottom: 7px;
      color: #333941;
    }

    .form-control,
    .form-select {
      border-color: #cfd7df;
      border-radius: 6px;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 .2rem rgba(0, 139, 138, .12);
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .settings-grid .wide { grid-column: 1 / -1; }

    details.advanced {
      margin-top: 20px;
      border-top: 1px solid var(--line);
      padding-top: 16px;
    }

    details.advanced summary {
      cursor: pointer;
      color: var(--ink);
      font-size: .86rem;
      font-weight: 750;
      list-style: none;
    }

    details.advanced summary::-webkit-details-marker { display: none; }

    .leeway-control {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 92px;
      gap: 12px;
      align-items: end;
      margin-top: 14px;
      padding: 13px;
      background: var(--panel-soft);
      border: 1px solid #d6e0e6;
      border-radius: 8px;
    }

    .leeway-control .form-check-label {
      font-size: .86rem;
      font-weight: 750;
    }

    .leeway-note {
      display: block;
      color: var(--muted);
      font-size: .76rem;
      margin-top: 3px;
    }

    .btn-calibrate {
      width: 100%;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-weight: 750;
      padding: 12px 16px;
      margin-top: 20px;
      transition: background .16s ease, transform .16s ease;
    }

    .btn-calibrate:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }

    .btn-calibrate:disabled {
      background: #8aa6a6;
      transform: none;
    }

    .back-link {
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      text-decoration: none;
      padding: 9px 12px;
      font-size: .86rem;
      font-weight: 700;
      background: #fff;
    }

    .confidence-summary {
      min-width: 190px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 14px 16px;
    }

    .confidence-summary span {
      color: var(--muted);
      display: block;
      font-size: .78rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .confidence-summary strong {
      display: block;
      font-size: 1.9rem;
      line-height: 1;
      margin-top: 4px;
    }

    .confidence-summary small { color: var(--muted); }

    .download-link {
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: var(--accent-dark);
      font-size: .82rem;
      font-weight: 750;
      padding: 8px 11px;
      text-decoration: none;
      white-space: nowrap;
    }

    .diagnostics {
      margin-top: 18px;
    }

    .diagnostics ul {
      columns: 2;
      column-gap: 28px;
      margin: 0;
      padding: 0;
      list-style: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .78rem;
      color: #3f4750;
    }

    .diagnostics li {
      break-inside: avoid;
      padding: 4px 0;
    }

    table {
      margin: 0;
    }

    table td,
    table th {
      font-size: .82rem;
      text-align: right;
      vertical-align: middle;
    }

    table th:first-child,
    table td:first-child {
      text-align: left;
    }

    .confidence-table th {
      background: #f4f6f8;
    }

    .confidence-cell {
      min-width: 82px;
      text-align: center;
    }

    .confidence-score {
      display: block;
      font-weight: 800;
      line-height: 1;
    }

    .confidence-label {
      display: block;
      font-size: .68rem;
      margin-top: 3px;
      text-transform: uppercase;
    }

    .confidence-high {
      background: rgba(18, 113, 91, .12) !important;
      color: var(--good) !important;
    }

    .confidence-medium {
      background: rgba(183, 121, 31, .13) !important;
      color: var(--warn) !important;
    }

    .confidence-low {
      background: rgba(180, 35, 24, .10) !important;
      color: var(--danger) !important;
    }

    .alert-panel {
      border-color: rgba(180, 35, 24, .28);
      background: #fff8f7;
    }

    .plot-panel img {
      display: block;
      width: 100%;
      height: auto;
    }

    .spinner-border {
      width: 1rem;
      height: 1rem;
    }

    @media (max-width: 860px) {
      .topbar-inner,
      .app-main {
        padding-left: 16px;
        padding-right: 16px;
      }

      .workspace-head,
      .result-head,
      .upload-grid,
      .result-grid,
      .plots-grid {
        grid-template-columns: 1fr;
      }

      .workflow-strip {
        min-width: 0;
      }

      .diagnostics ul {
        columns: 1;
      }
    }

    @media (max-width: 540px) {
      .topbar-inner {
        align-items: flex-start;
        flex-direction: column;
        padding-top: 16px;
        padding-bottom: 16px;
      }

      .workflow-strip,
      .settings-grid,
      .leeway-control {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 2.35rem;
      }
    }
  </style>
</head>
<body>
  <nav class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>
          <span class="brand-name">RaceCal BSP Lab</span>
          <span class="brand-sub">High-end sailing calibration</span>
        </span>
      </a>
      <span class="env-label">calibration.jellelourens.nl</span>
    </div>
  </nav>
  <main class="app-main">
    {% block content %}{% endblock %}
  </main>
  <script>
    document.querySelectorAll('[data-leeway-control]').forEach(control => {
      const toggle = control.querySelector('[data-leeway-toggle]');
      const value = control.querySelector('[data-leeway-value]');
      const hidden = control.querySelector('[data-leeway-hidden]');

      const sync = () => {
        const active = toggle.checked;
        value.disabled = !active;
        hidden.value = active ? value.value : '0';
        control.classList.toggle('is-active', active);
      };

      toggle.addEventListener('change', sync);
      value.addEventListener('input', sync);
      sync();
    });

    document.querySelectorAll('form').forEach(form => {
      form.addEventListener('submit', () => {
        form.querySelectorAll('[data-leeway-control]').forEach(control => {
          const event = new Event('input', { bubbles: true });
          control.querySelector('[data-leeway-value]').dispatchEvent(event);
        });
        const btn = form.querySelector('button[type=submit]');
        if (btn) {
          btn.disabled = true;
          btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Kalibreren';
        }
      });
    });
  </script>
</body>
</html>
