<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BSP Calibratie</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; }
    .navbar-brand { font-weight: 700; letter-spacing: .03em; }
    .card { border: none; box-shadow: 0 1px 5px rgba(0,0,0,.08); }
    .card-header { font-weight: 600; }
    table td, table th { font-size: .82rem; text-align: right; }
    table th:first-child, table td:first-child { text-align: left; }
    .spinner-border { width: 1.2rem; height: 1.2rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4 px-3">
    <a class="navbar-brand" href="/">⛵ BSP Calibratie</a>
    <span class="text-secondary small">calibration.jellelourens.nl</span>
  </nav>
  <div class="container-lg pb-5">
    {% block content %}{% endblock %}
  </div>
  <script>
    // Disable submit button and show spinner on form submit
    document.querySelectorAll('form').forEach(form => {
      form.addEventListener('submit', () => {
        const btn = form.querySelector('button[type=submit]');
        if (btn) {
          btn.disabled = true;
          btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Bezig…';
        }
      });
    });
  </script>
</body>
</html>
